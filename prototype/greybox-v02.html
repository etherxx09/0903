<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>天涯若比邻｜灰盒 v0.2</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#222;background:#f3f2ee}*{box-sizing:border-box}body{margin:0}header{padding:18px 26px;background:#222;color:white;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:20px;margin:0}header small{color:#bbb}main{max-width:1250px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px}.screen,.panel{background:#fff;border:1px solid #ccc;border-radius:12px;padding:20px}.stage{min-height:430px;border:2px dashed #aaa;background:#e8e6df;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center;position:relative}.stage h2{margin:0}.props{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.prop{padding:25px 17px;background:#fff;border:2px solid #555;border-radius:10px;cursor:pointer;min-width:105px}.prop:hover,.prop:focus{background:#dce8e5}.placeholder{border:2px dashed #888;padding:45px 20px;background:#f9f9f7;min-width:min(100%,430px);color:#555}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button{cursor:pointer;border:1px solid #555;background:#fff;border-radius:7px;padding:10px 14px}button:hover{background:#e6eee9}button:disabled{opacity:.4;cursor:not-allowed}.tag{display:inline-block;background:#eee;padding:5px 8px;border-radius:5px;font-size:12px}.panel h3{margin-top:0}.note{padding:10px;border-left:3px solid #999;background:#f5f5f5;margin:9px 0;font-size:13px}.state{font-family:monospace;background:#eaeaea;padding:8px;border-radius:5px;overflow-wrap:anywhere}.diagram{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12px;margin:12px 0}.node{padding:7px;border:1px solid #888;border-radius:5px}.active{background:#cbe7d8;border-color:#247657}footer{font-size:12px;color:#666;margin-top:20px}@media(max-width:800px){main{grid-template-columns:1fr}.stage{min-height:340px}.prop{min-width:90px;padding:18px 10px}}</style></head><body>
<header><div><h1>天涯若比邻｜交互灰盒 v0.2</h1><small>可点击的画面与状态机占位 · 非最终设计</small></div><span>PROTOTYPE / 2026.10.31</span></header><main><section class="screen"><div id="stage" class="stage" aria-live="polite"></div><div class="controls" id="controls"></div><footer>灰盒只验证状态与画面切换；照片、视频、视觉风格、微交互均为占位。当前流程不是最终叙事顺序。</footer></section><aside class="panel"><h3>状态机</h3><div id="state" class="state"></div><div class="diagram" id="diagram"></div><h3>当前画面待办</h3><div id="notes"></div><h3>本版未实现</h3><div class="note">拖拽混合、冲泡模拟、复杂动画、声音空间化、自由时间轴、真实物件组合判定。以上均需后续交互设计。</div><div class="note">所有历史影像与文化叙事内容需要研究核实、素材来源与使用授权。</div></aside></main>
<script>
const objects=['Kopi','Teh','吐司＋半熟蛋','炼乳','淡奶'];let state='idle',selected='Kopi',period='当代',completed=new Set();const $=id=>document.getElementById(id);
const notes={idle:['待补充：Kopitiam 桌面俯视照片或视频','待设计：物件热点、点击反馈、桌面布局'],focus:['待补充：当前物件高清照片 / 特写 / 序列帧','待设计：放大、触发区域、文字叙事与物件动作'],context:['待补充：经核实的历史与当代街景照片/视频','待设计：镜头缩放、年代转换、回到物件的过渡'],multi:['待补充：Kopi × Teh / 炼乳 × 淡奶 × Kopi 的画面素材','待设计：组合触发条件、饮品变化与关系叙事'],resolved:['待补充：变化后桌面或物件状态画面','待设计：完成提示、收走条件、进度记录']};
function go(s){state=s;render()}function btn(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=fn;$('controls').append(b)}
function render(){const stage=$('stage'),c=$('controls');stage.innerHTML='';c.innerHTML='';$('state').textContent=state.toUpperCase()+' / '+selected+' / '+period;const title=(s)=>{let h=document.createElement('h2');h.textContent=s;stage.append(h)},placeholder=s=>{let d=document.createElement('div');d.className='placeholder';d.textContent=s;stage.append(d)};
if(state==='idle'){title('S0｜Kopitiam 桌面');placeholder('[桌面俯视照片 / 视频占位]');let row=document.createElement('div');row.className='props';objects.forEach(o=>{let b=document.createElement('button');b.className='prop';b.textContent=o+(completed.has(o)?' ✓':'');b.onclick=()=>{selected=o;go('focus')};row.append(b)});stage.append(row);btn('多物件剧场（占位）',()=>go('multi'))}
if(state==='focus'){title('S1｜'+selected+' · 物件聚焦');placeholder('[物件特写照片 / 视频 / 序列帧占位]');let p=document.createElement('p');p.textContent=selected==='吐司＋半熟蛋'?'组合物件：好近又好远（不拆分）':'此处保留单物件叙事与动作触发区域';stage.append(p);btn('城市 / 时间视角',()=>go('context'));btn('多物件关系',()=>go('multi'));btn('标记体验完成',()=>go('resolved'));btn('返回桌面',()=>go('idle'))}
if(state==='context'){title('S2｜城市景观 · '+period);placeholder('[经核实的'+period+'街景照片 / 视频占位]');btn('切换至历史',()=>{period='历史';render()});btn('切换至当代',()=>{period='当代';render()});btn('返回物件',()=>go('focus'));btn('继续至结果',()=>go('resolved'))}
if(state==='multi'){title('S3｜多物件剧场');placeholder('[Kopi × Teh / 炼乳 × 淡奶 × Kopi 画面占位]');let p=document.createElement('p');p.textContent='关系与饮品变化逻辑尚未实现；这里仅演示剧场状态入口。';stage.append(p);btn('返回物件',()=>go('focus'));btn('返回桌面',()=>go('idle'));btn('查看结果占位',()=>go('resolved'))}
if(state==='resolved'){title('S4｜完成 / 桌面变化');placeholder('[完成反馈 / 变化后桌面占位]');btn('记录并返回桌面',()=>{completed.add(selected);go('idle')});btn('返回物件',()=>go('focus'))}
$('notes').innerHTML=notes[state].map(n=>'<div class="note">'+n+'</div>').join('');$('diagram').innerHTML=['idle','focus','context','multi','resolved'].map((s,i)=>'<span class="node '+(s===state?'active':'')+'">'+s+'</span>'+(i<4?' → ':'')).join('');}render();
</script></body></html>
